name: Question
description: Ask for help understanding or using the boilerplate.
title: "question: "
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I read README.md, SUPPORT.md, and the relevant project documentation.
          required: true
        - label: I searched existing issues for an answer.
          required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Explain what you are trying to accomplish.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What you tried
      description: Include relevant commands, documentation, and sanitized output.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version, and uv version when relevant.
