name: Bug report
description: Report a reproducible problem in the reusable boilerplate.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include secrets or security
        vulnerabilities here; follow SECURITY.md for private reports.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This affects the boilerplate rather than only a derived project.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and why it is a problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version, uv version, and relevant tool versions.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, or links when useful.
