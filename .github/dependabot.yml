version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    groups:
      python-development-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    ignore:
      # Keep this revision aligned with UV_VERSION in the CI workflow.
      - dependency-name: https://github.com/astral-sh/uv-pre-commit
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
