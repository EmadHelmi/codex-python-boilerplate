workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - test

default:
  image: python:3.14-slim
  interruptible: true
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
    - git --version
    - python -m pip install --disable-pip-version-check uv==0.12.6
    - uv sync --locked

variables:
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

quality:
  stage: test
  script:
    - uv run pre-commit run --all-files
    - uv run pytest --cov --cov-report=term-missing

# setup:collaborative:start
validate-metadata:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python .gitlab/scripts/validate_mr.py
# setup:collaborative:end
